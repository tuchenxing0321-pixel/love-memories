<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <link rel="icon" href="assets/site-logo-128.png">
  <link rel="stylesheet" href="assets/page-transitions.css?v=20261123b">
  <title>管理登录 · nono &amp; txx</title>
  <style>
    :root{--paper:#f8f7f4;--surface:#fff;--ink:#24211f;--muted:#675f59;--line:#ded9d2;--accent:#7e2f40;--danger:#8f3447;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{min-height:100svh;margin:0;background:linear-gradient(90deg,rgba(126,47,64,.025),transparent 32%,transparent 68%,rgba(126,47,64,.025))}button,input{font:inherit}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:68px;padding:0 clamp(20px,5vw,72px);border-bottom:1px solid var(--line)}.back{justify-self:start;min-height:44px;padding:0;border:0;color:var(--muted);background:none;cursor:pointer}.brand{font:600 17px/1 Georgia,"Songti SC",serif;letter-spacing:-.02em}.state{justify-self:end;color:var(--muted);font-size:12px}
    main{display:grid;min-height:calc(100svh - 68px);place-items:center;padding:56px 20px}.panel{width:min(440px,100%);padding:42px 40px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}h1{margin:0;font:500 clamp(38px,8vw,56px)/.95 Georgia,"Songti SC",serif;letter-spacing:-.05em}header p{margin:18px 0 34px;color:var(--muted);font-size:14px;line-height:1.8}.field{display:block;margin-top:20px;color:var(--muted);font-size:12px}.field input{display:block;width:100%;height:48px;margin-top:8px;padding:0 13px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fbfaf8;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(126,47,64,.09)}.submit,.signout{width:100%;min-height:48px;margin-top:26px;border:0;border-radius:9px;cursor:pointer}.submit{color:#fff;background:var(--ink)}.submit:hover{background:#090807}.submit:disabled{cursor:wait;opacity:.55}.signout{margin-top:10px;color:var(--ink);background:#f1efeb}.message{min-height:22px;margin:18px 0 0;color:var(--muted);font-size:12px;line-height:1.65}.message.error{color:var(--danger)}.identity{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.7;overflow-wrap:anywhere}.hidden{display:none}::selection{color:#fff;background:var(--accent)}
    .top{height:var(--ui-header-height);padding:0 var(--ui-page-gutter);background:rgba(248,247,244,.96)}.brand{display:flex;gap:9px;align-items:center;font-family:var(--ui-font-display);letter-spacing:-.025em}.brand img{width:24px;height:24px;object-fit:contain}main{min-height:calc(100svh - var(--ui-header-height))}h1{font-family:var(--ui-font-display);letter-spacing:-.04em}
    @media(max-width:520px){.top{grid-template-columns:1fr auto;padding:0 18px}.brand{display:none}.state{font-size:11px}.panel{padding:34px 24px;border-radius:14px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="top"><button class="back" id="back" type="button">← 返回</button><div class="brand"><img src="assets/site-logo-128.png" alt=""><span>nono &amp; txx</span></div><span class="state">只有已授权账号可修改</span></header>
  <main>
    <section class="panel" aria-labelledby="title">
      <header><h1 id="title">管理登录</h1><p>使用已在 CloudBase 中创建的主人或管理员账号。这里不提供公开注册。</p></header>
      <form id="loginForm">
        <label class="field">用户名或邮箱<input id="identifier" name="identifier" autocomplete="username" required></label>
        <label class="field">密码<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button class="submit" id="submit" type="submit">登录并返回</button>
      </form>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <p class="identity hidden" id="identity"></p>
      <button class="signout hidden" id="signout" type="button">退出当前账号</button>
    </section>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script src="assets/cloudbase-dates-config.js?v=20261110a"></script>
  <script src="assets/cloudbase-config.js?v=20261110a"></script>
  <script src="assets/cloudbase-client.js?v=20261110a"></script>
  <script>
    const $=id=>document.getElementById(id);
    const allowedNext=new Set(['index.html','memories.html','photo-manager.html','dates.html']);
    const requested=new URLSearchParams(location.search).get('next')||'index.html';
    const next=allowedNext.has(requested)?requested:'index.html';
    function message(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error)}
    function showIdentity(access){$('identity').textContent=`当前账号 UID：${access.uid||'未知'} · 权限：${access.role==='owner'?'主人':access.role==='editor'?'管理员':'未授权'}`;$('identity').classList.remove('hidden');$('signout').classList.remove('hidden')}
    async function verify(){try{const state=await CloudBaseClient.authState();if(!state.session||state.user?.is_anonymous)return;const access=await CloudBaseClient.access();showIdentity(access);if(access.canWrite){message('身份已验证，正在返回…');setTimeout(()=>location.replace(next),350)}else message('账号已登录，但还未被主人加入管理名单。',true)}catch(error){message(error.message||'无法验证账号',true)}}
    $('loginForm').onsubmit=async event=>{event.preventDefault();const button=$('submit');button.disabled=true;button.textContent='正在验证…';message('');try{await CloudBaseClient.signIn($('identifier').value,$('password').value);const access=await CloudBaseClient.access();showIdentity(access);if(!access.canWrite)throw new Error('登录成功，但该账号还未被授权。请把上方 UID 交给主人。');message('身份已验证，正在返回…');setTimeout(()=>location.replace(next),350)}catch(error){message(error.message||'登录失败',true)}finally{button.disabled=false;button.textContent='登录并返回'}};
    $('signout').onclick=async()=>{try{await CloudBaseClient.signOut();location.reload()}catch(error){message(error.message,true)}};
    $('back').onclick=()=>location.replace(next);
    verify();
  </script>
</body>
</html>
