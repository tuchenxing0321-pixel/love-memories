<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <link rel="icon" type="image/png" href="assets/site-logo-128.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/site-logo-180.png">
  <link rel="stylesheet" href="assets/page-transitions.css?v=20261123b">
  <title>秘密</title>
  <style>
    :root{--paper:var(--ui-bg);--surface:var(--ui-surface);--ink:var(--ui-ink);--muted:var(--ui-muted);--line:var(--ui-line);--accent:var(--ui-accent)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}[hidden]{display:none!important}
    body{background:var(--paper)}
    .top{position:sticky;z-index:3;top:0;display:grid;height:var(--ui-header-height);grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--ui-page-gutter);border-bottom:1px solid var(--ui-line);background:rgba(250,250,250,.96)}.back{justify-self:start;padding:8px 0;color:#6e6e73;border:0;background:none;font:500 12px/1.2 inherit;letter-spacing:.08em;cursor:pointer;transition:color .18s,transform .2s}.back:hover{color:var(--ink);transform:translateX(-2px)}.brand{font:600 17px/1 var(--ui-font-display);letter-spacing:-.025em}.privacy{justify-self:end;color:var(--ui-muted);font-size:11px;letter-spacing:.14em}button:focus-visible,input:focus-visible{outline:2px solid rgba(164,93,99,.5);outline-offset:3px}
    .lock-screen{display:grid;min-height:calc(100svh - var(--ui-header-height));padding:24px;place-items:center}.lock-card{width:min(90vw,400px);padding:46px 40px 36px;border:1px solid var(--line);border-radius:20px;background:var(--surface);text-align:center;box-shadow:0 14px 40px rgba(29,29,31,.055)}.lock-card:before{display:none}.lock-mark{margin:0 0 23px;color:var(--accent);font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em}.lock-card h1{margin:0;font:500 34px/1.18 "Songti SC","STSong",serif;letter-spacing:-.035em}.lock-card>p{max-width:270px;margin:14px auto 27px;color:var(--muted);font-size:12px;line-height:1.75}.unlock-form{display:grid;gap:12px}.unlock-form input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);text-align:center;font-size:17px;letter-spacing:.32em;transition:border-color .18s,background .18s,box-shadow .18s}.unlock-form input::placeholder{color:#a1a1a6;font-size:13px;letter-spacing:.13em}.unlock-form input:focus{border-color:rgba(164,93,99,.55);background:#fff;box-shadow:0 0 0 3px rgba(164,93,99,.08)}.unlock-form button{padding:14px 16px;color:#fff;border:0;border-radius:12px;background:var(--ink);font:600 12px/1.2 inherit;letter-spacing:.04em;cursor:pointer;transition:transform .18s,background .18s}.unlock-form button:hover{background:#353537;transform:translateY(-1px)}.unlock-form button:disabled{opacity:.55;cursor:wait;transform:none}.error{min-height:17px;margin:1px 0 0!important;color:var(--accent)!important;font-size:11px!important}
    .secret-main{display:grid;min-height:calc(100svh - var(--ui-header-height));padding:24px;place-items:center}.note-frame{width:min(74vw,470px,calc((100svh - 175px)*.756));margin:0;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 12px 34px rgba(29,29,31,.05)}.note-frame img{display:block;width:100%;height:auto;border-radius:9px}
    @media(max-width:560px){.top{padding:0 20px}.privacy{visibility:hidden}.lock-screen{padding:18px}.lock-card{padding:40px 28px 30px;border-radius:18px}.lock-card h1{font-size:32px}.secret-main{padding:18px}.note-frame{width:min(84vw,430px,calc((100svh - 125px)*.756));padding:9px}}
    @media(prefers-reduced-motion:reduce){.back,.unlock-form input,.unlock-form button{transition:none}}
    .top{background:rgba(248,247,244,.96)}.brand{display:flex;gap:9px;align-items:center}.brand img{width:24px;height:24px;object-fit:contain}.lock-card{border-radius:18px;box-shadow:none}.lock-card h1{font-family:var(--ui-font-display)}.lock-card>p{font-size:13px}.unlock-form input{border-radius:9px}.unlock-form input::placeholder{color:#6e6e73}.unlock-form button{min-height:44px;border-radius:9px}
  </style>
</head>
<body>
  <header class="top"><button class="back" id="back" type="button">← 返回</button><div class="brand"><img src="assets/site-logo-128.png" alt=""><span>nono &amp; txx</span></div><span class="privacy">PRIVATE</span></header>
  <section class="lock-screen" id="lockScreen" aria-labelledby="lockTitle">
    <div class="lock-card">
      <h1 id="lockTitle">简单浏览保护</h1>
      <p>这是一层简单的浏览保护，不等于账号权限控制。请勿放置无法公开的敏感内容。</p>
      <form class="unlock-form" id="unlockForm">
        <label><span hidden>四位密码</span><input id="password" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="四位密码" placeholder="请输入四位密码" required autofocus></label>
        <button id="unlock" type="submit">解锁查看</button>
        <p class="error" id="error" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </section>
  <main class="secret-main" id="secretMain" tabindex="-1" hidden>
    <figure class="note-frame"><img id="secretImage" src="assets/site-logo-128.png" alt="手写的秘密留言"></figure>
  </main>
  <noscript>此页需要启用 JavaScript 才能解密查看。</noscript>
  <script>
    const ITERATIONS = 250000;
    const OPENSSL_MAGIC = [83,97,108,116,101,100,95,95];
    const ENCRYPTED_ASSET = 'assets/secret-note.enc?v=20261015';
    const ATTEMPT_KEY = 'nono-secret-attempts-v1';
    let imageUrl = '';

    function attemptState() {
      try { return JSON.parse(sessionStorage.getItem(ATTEMPT_KEY)) || {failures:0,lockedUntil:0}; }
      catch { return {failures:0,lockedUntil:0}; }
    }

    function registerFailure() {
      const state = attemptState();
      state.failures += 1;
      if (state.failures >= 3) state.lockedUntil = Date.now() + Math.min(30000, 5000 * 2 ** (state.failures - 3));
      sessionStorage.setItem(ATTEMPT_KEY, JSON.stringify(state));
      return state;
    }

    function normalizePassword(value) {
      return value.trim().replace(/[０-９]/g, digit => String.fromCharCode(digit.charCodeAt(0) - 0xfee0));
    }

    async function decryptImage(password) {
      const response = await fetch(ENCRYPTED_ASSET, {cache:'no-store'});
      if (!response.ok) throw new Error('RESOURCE_LOAD');
      const encrypted = new Uint8Array(await response.arrayBuffer());
      if (encrypted.length < 33 || !OPENSSL_MAGIC.every((byte, index) => encrypted[index] === byte)) throw new Error('RESOURCE_INVALID');
      const salt = encrypted.slice(8, 16);
      const passwordKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
      const material = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:ITERATIONS, hash:'SHA-256'}, passwordKey, 384));
      const key = await crypto.subtle.importKey('raw', material.slice(0, 32), {name:'AES-CBC'}, false, ['decrypt']);
      const plain = new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC', iv:material.slice(32, 48)}, key, encrypted.slice(16)));
      if (plain[0] !== 0xff || plain[1] !== 0xd8 || plain[2] !== 0xff) throw new Error('PASSWORD_INVALID');
      return new Blob([plain], {type:'image/jpeg'});
    }

    const passwordInput = document.getElementById('password');
    function resetSecret() {
      if (imageUrl) URL.revokeObjectURL(imageUrl);
      imageUrl = '';
      document.getElementById('secretImage').src = 'assets/site-logo-128.png';
      document.getElementById('secretMain').hidden = true;
      document.getElementById('lockScreen').hidden = false;
      document.getElementById('error').textContent = '';
      passwordInput.value = '';
    }
    passwordInput.addEventListener('input', () => {
      passwordInput.value = normalizePassword(passwordInput.value).replace(/\D/g, '').slice(0, 4);
    });

    document.getElementById('unlockForm').onsubmit = async event => {
      event.preventDefault();
      const input = passwordInput;
      const button = document.getElementById('unlock');
      const error = document.getElementById('error');
      const password = normalizePassword(input.value);
      const currentAttempt = attemptState();
      if (currentAttempt.lockedUntil > Date.now()) {
        error.textContent = `尝试次数过多，请 ${Math.ceil((currentAttempt.lockedUntil - Date.now()) / 1000)} 秒后再试。`; return;
      }
      if (!/^\d{4}$/.test(password)) {
        error.textContent = '请输入四位数字密码。'; input.focus(); return;
      }
      button.disabled = true; button.textContent = '正在解密…'; error.textContent = '';
      try {
        const blob = await decryptImage(password);
        imageUrl = URL.createObjectURL(blob);
        document.getElementById('secretImage').src = imageUrl;
        document.getElementById('lockScreen').hidden = true;
        document.getElementById('secretMain').hidden = false;
        document.getElementById('secretMain').focus();
        sessionStorage.removeItem(ATTEMPT_KEY);
        input.value = '';
      } catch (decryptError) {
        const wrongPassword = decryptError.name === 'OperationError' || decryptError.message === 'PASSWORD_INVALID';
        input.value = ''; input.focus();
        if (wrongPassword) {
          const nextAttempt = registerFailure(), wait = Math.max(0, nextAttempt.lockedUntil - Date.now());
          error.textContent = wait ? `密码不正确，请 ${Math.ceil(wait / 1000)} 秒后再试。` : '密码不正确，请重新输入。';
        } else error.textContent = '加密内容加载失败，请刷新后重试。';
      } finally {
        button.disabled = false; button.textContent = '解锁查看';
      }
    };
    document.getElementById('back').onclick = () => {
      if (sessionStorage.getItem('nono-index-parent') === '1' && history.length > 1) {
        sessionStorage.removeItem('nono-index-parent'); sessionStorage.setItem('nono-index-reset','1'); history.back();
      } else location.replace('index.html');
    };
    addEventListener('pagehide', resetSecret);
    addEventListener('pageshow', event => { if (event.persisted) { resetSecret(); passwordInput.focus(); } });
    console.assert(ITERATIONS >= 200000 && OPENSSL_MAGIC.length === 8 && registerFailure instanceof Function, '秘密页加密参数异常');
  </script>
  <script src="assets/music-continuation.js?v=20261109e"></script>
</body>
</html>
