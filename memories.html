    /* Warm, neutral gallery treatment: the current image stays fully visible. */

  <dialog id="photoManager" aria-labelledby="photoManagerHeading"><div class="inner"><div class="dialog-head"><div><h2 id="photoManagerHeading">管理照片</h2><p>查看全部照片，选择需要删除的那一张。</p></div><button class="icon-close" type="button" data-close="photoManager" aria-label="关闭">×</button></div><form class="form" id="photoForm"><section class="manager-library" aria-label="全部照片"><div class="manager-library-head"><strong id="managerCount">照片库共 0 张</strong><span>删除后 7 秒内可撤回</span></div><div class="manager-grid" id="managerGrid"></div></section><label class="field">照片名称<input id="photoTitle" maxlength="60" placeholder="例如：故事开始"></label><label class="field">拍摄日期<input id="photoDate" type="date"></label><label class="field wide">批量添加照片（一次最多 12 张）<span class="file-box"><input id="photoFile" type="file" accept="image/*" multiple required></span></label><div class="form-actions"><button class="secondary" type="button" data-close="photoManager">取消</button><button class="primary" id="photoSave" type="submit">添加所选照片</button></div></form></div></dialog>

  <dialog id="eventEditor" aria-labelledby="eventEditorTitle"><div class="inner"><div class="dialog-head"><h2 id="eventEditorTitle">添加事件</h2><button class="icon-close" type="button" data-close="eventEditor" aria-label="关闭">×</button></div><form class="form" id="eventForm"><input id="eventId" type="hidden"><label class="field wide">事件标题<input id="eventTitle" required maxlength="60"></label><label class="field">日期<input id="eventDate" type="date" required></label><label class="field">事件类型<select id="eventType"><option value="minor">小事件 · 黑色标志</option><option value="major">大事件 · 红色标志</option></select></label><label class="field wide">地点（可选）<input id="eventPlace" maxlength="80"></label><label class="field wide">事件内容<textarea id="eventStory" maxlength="1200" placeholder="把这一天写下来"></textarea></label><label class="field wide">添加照片（可多选）<span class="file-box"><input id="eventImages" type="file" accept="image/*" multiple></span></label><div class="form-actions"><button class="secondary" type="button" data-close="eventEditor">取消</button><button class="primary" id="eventSave" type="submit">保存事件</button></div></form></div></dialog>

  <dialog id="detail" aria-labelledby="detailTitle"><div class="detail-hero"><button class="icon-close" type="button" data-close="detail" aria-label="关闭">×</button><div class="detail-date" id="detailDate"></div><h2 id="detailTitle"></h2></div><div class="detail-body"><div class="detail-place" id="detailPlace"></div><p class="detail-story" id="detailStory"></p><div class="gallery" id="detailGallery"></div><div class="detail-actions"><button class="primary" id="detailAddImage" type="button">＋ 添加图片</button><button class="secondary" id="detailEdit" type="button">编辑事件</button><button class="danger" id="detailDelete" type="button">删除事件</button><input class="hidden" id="detailImageInput" type="file" accept="image/*" multiple aria-label="为当前事件选择要添加的图片"></div></div></dialog>

  <dialog id="photoViewer" aria-labelledby="viewerTitle"><div class="viewer"><button class="icon-close" type="button" data-close="photoViewer" aria-label="关闭">×</button><img id="viewerImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="回忆照片"><div class="viewer-copy"><div class="viewer-meta"><b id="viewerTitle"></b><span id="viewerMeta"></span></div><button class="viewer-delete" id="viewerDelete" type="button">删除照片</button></div></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastAction" type="button">撤回</button></div>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script src="assets/cloudbase-dates-config.js?v=20261026b"></script>
  <script src="assets/cloudbase-config.js?v=20261026c"></script>
  <script src="assets/cloudbase-client.js?v=20261028e"></script>
  <script src="assets/cloud-memory-library.js?v=20261026c"></script>
  <script>
    const MemoryLibrary = window.MemoryLibrary;
    const $ = id => document.getElementById(id);
    const esc = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    // 隐藏曾误入回忆库的秘密页专用图片，不删除用户本地原记录。
    const privateImageSignature = { length: 37611, crc32: 1070910964 };
    const crc32Table = Array.from({length:256},(_,value)=>{let result=value;for(let bit=0;bit<8;bit++)result=(result&1)?0xedb88320^(result>>>1):result>>>1;return result>>>0});
    function crc32Text(text){let result=0xffffffff;for(let index=0;index<text.length;index++)result=crc32Table[(result^text.charCodeAt(index))&255]^(result>>>8);return (result^0xffffffff)>>>0}
    function isPrivateImage(image){const data=String(image?.data||'');if(data.length!==privateImageSignature.length)return false;try{return crc32Text(atob(data.slice(data.indexOf(',')+1)))===privateImageSignature.crc32}catch{return false}}
    const visibleImages = record => (record.images || []).filter(image => !isPrivateImage(image));
    console.assert(crc32Text('123456789')===0xcbf43926,'图片隐私指纹校验异常');
    let records = [], activeEventId = '', activePhoto = null, carouselPhotos = [], activePhotoIndex = 0, pendingPhotoId = '', toastTimer, railResizeTimer, renderedRailWidth = 0, activeYear = 'all', lastUndo = null, railOrderKey = '', railOrderIds = [], cloudReady = false, canWrite = false, accessRole = 'viewer', loadState = 'loading';
    const railMotionPreference = matchMedia('(prefers-reduced-motion: reduce)');
    let railPaused = false, railInView = true;
    const initialParams = new URLSearchParams(location.search);
    let initialEventId = initialParams.get('event') || '', initialPhotoId = initialParams.get('photo') || '';

    function toast(message, error = false, undo = null) {
      const box = $('toast');
      $('toastText').textContent = message;
      lastUndo = undo;
      box.className = `toast show${error ? ' error' : ''}${undo ? ' has-action' : ''}`;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { box.className = 'toast'; lastUndo = null; }, undo ? 7000 : 3200);
    }
    function readableError(error) {
      const message = String(error?.message || '');
      if (error && (error.name === 'QuotaExceededError' || /quota/i.test(message))) return '浏览器本地空间不足，请删除部分大图后再试。';
      if (/invalid refresh token|refresh token|token.*expired|login.*expired/i.test(message)) return '登录状态已过期，请前往管理登录重新登录。';
      return error?.message || '操作失败，请重试。';
    }
    const stateMarkup = (kind, title, copy, action = '') => `<div class="ui-state ui-state--${kind}" role="${kind === 'error' ? 'alert' : 'status'}"><span class="ui-state__line" aria-hidden="true"></span><h3 class="ui-state__title">${esc(title)}</h3><p class="ui-state__copy">${esc(copy)}</p>${action ? `<button class="ui-state__action" type="button" data-state-retry>${esc(action)}</button>` : ''}</div>`;
    function formatDate(date) { return String(date || '').replaceAll('-', '.'); }
    function updatePauseControl() {
      const reduced = railMotionPreference.matches;
      const stopped = reduced || railPaused || !railInView || document.hidden;
      $('railShell').classList.toggle('is-paused', stopped);
      $('railToggle').setAttribute('aria-pressed', String(reduced || railPaused));
      $('railToggle').disabled = railMotionPreference.matches;
      $('railToggle').setAttribute('aria-label', reduced ? '已按系统设置减少动态效果' : railPaused ? '继续照片滚动' : '暂停照片滚动');
      $('railToggle').querySelector('span').textContent = reduced ? '动态已关' : railPaused ? '继续' : '暂停';
      $('railToggle').querySelector('svg').innerHTML = railPaused && !reduced ? '<path d="M3 2.5 13 8 3 13.5z"/>' : '<path d="M3 2.5h3.5v11H3zm6.5 0H13v11H9.5z"/>';
    }
    function selectPhoto(index) {
      activePhotoIndex = index;
      const photo = carouselPhotos[index];
      if (!photo) { $('activeMemory').textContent = ''; return; }
      $('activeMemory').innerHTML = `<strong>${formatDate(photo.date)}</strong><span>${esc(photo.title || '一张照片')}</span>`;
    }
    function allPhotos() {
      const photos = [];
      records.forEach(record => visibleImages(record).forEach(image => photos.push({recordId:record.id, kind:record.kind, title:record.title, date:image.uploadedAt || record.date, image})));
      return photos.sort((a,b) => String(a.date).localeCompare(String(b.date)) || String(a.image.id).localeCompare(String(b.image.id)));
    }
    function randomizedPhotos(photos) {
      const key = photos.map(photo => photo.image.id).sort().join('|');
      if (key !== railOrderKey) {
        railOrderKey = key;
        railOrderIds = photos.map(photo => photo.image.id);
        for (let index = railOrderIds.length - 1; index > 0; index--) {
          const target = Math.floor(Math.random() * (index + 1));
          [railOrderIds[index], railOrderIds[target]] = [railOrderIds[target], railOrderIds[index]];
        }
      }
      const byId = new Map(photos.map(photo => [photo.image.id, photo]));
      return railOrderIds.map(id => byId.get(id)).filter(Boolean);
    }
    function planPhotoLanes(photos, targetPerLane) {
      const lanes = [[], []];
      photos.forEach((photo, index) => lanes[index % 2].push(photo));
      if (!photos.length || photos.length >= targetPerLane * 2) return lanes;
      lanes.forEach((lane, laneIndex) => {
        let cursor = laneIndex;
        while (lane.length < targetPerLane) {
          lane.push(photos[cursor % photos.length]);
          cursor += 2;
        }
      });
      return lanes;
    }
    console.assert(new Set(planPhotoLanes([1,2,3,4],2).flat()).size === 4, '照片足够时不应重复');
    console.assert(planPhotoLanes([1,2],3).every(lane => lane.length === 3), '照片不足时应补足两排');

    function renderRail() {
      renderedRailWidth = Math.ceil($('railShell').getBoundingClientRect().width || innerWidth || 1200);
      const previousId = pendingPhotoId || carouselPhotos[activePhotoIndex]?.image.id;
      carouselPhotos = randomizedPhotos(allPhotos());
      $('railShell').classList.toggle('is-loading', loadState === 'loading');
      if (loadState === 'loading') {
        $('railToggle').hidden = true; $('filmManage').hidden = true; $('activeMemory').textContent = '';
        $('rail').innerHTML = stateMarkup('loading', '正在整理回忆', '照片和时间线准备好后会一起出现。');
        return;
      }
      if (loadState === 'error') {
        $('railToggle').hidden = true; $('filmManage').hidden = true; $('activeMemory').textContent = '';
        $('rail').innerHTML = stateMarkup('error', '暂时无法读取回忆', '网络或云端服务暂时不可用，本地旧资料没有被修改。', '重新读取');
        $('rail').querySelector('[data-state-retry]').onclick = render;
        return;
      }
      $('railShell').classList.remove('is-loading');
      if (!carouselPhotos.length) {
        $('railShell').classList.add('is-empty');
        $('railToggle').hidden = true;
        $('filmManage').hidden = true;
        $('rail').innerHTML = `<div class="rail-empty"><div><b>等一张属于你们的照片</b><br><button id="emptyAdd">${canWrite?'添加第一张照片':'登录后添加'}</button></div></div>`;
        $('activeMemory').textContent = '';
        $('emptyAdd').onclick = openPhotoManager;
        return;
      }
      $('railShell').classList.remove('is-empty');
      $('filmManage').hidden = false;
      $('railToggle').hidden = false;
      const matchedIndex = carouselPhotos.findIndex(photo => photo.image.id === previousId);
      activePhotoIndex = matchedIndex < 0 ? Math.min(activePhotoIndex, carouselPhotos.length - 1) : matchedIndex;
      pendingPhotoId = '';
      const widths = ['clamp(174px,13vw,216px)','clamp(214px,17vw,282px)','clamp(188px,14.5vw,240px)','clamp(230px,18vw,298px)'];
      // Cover the widest viewport using the smallest card; 150px also covers the reverse lane offset.
      const targetPerLane = Math.max(2, Math.ceil((renderedRailWidth + 150) / 174) + 1);
      const eagerLimit = Math.min(carouselPhotos.length, targetPerLane * 2);
      const photoButton = (photo, index, clone = false) => `<button class="memory-card" style="--card-width:${widths[index % widths.length]}" data-photo-index="${index}" ${clone ? 'data-clone="true" tabindex="-1" aria-hidden="true"' : ''} aria-label="查看${esc(photo.title || '回忆照片')}，${formatDate(photo.date)}"><img src="${photo.image.data}" alt="${esc(photo.image.caption || photo.title || '回忆照片')}" loading="${!clone && index < eagerLimit ? 'eager' : 'lazy'}" decoding="async" fetchpriority="${!clone && index < 2 ? 'high' : 'low'}"></button>`;
      const indexed = carouselPhotos.map((photo,index) => ({photo,index}));
      const [forward, reverse] = planPhotoLanes(indexed, targetPerLane);
      const sequence = (photos, clone = false) => photos.map(({photo,index}) => photoButton(photo,index,clone)).join('');
      const lane = (photos, reversed = false) => `<div class="memory-lane${reversed ? ' is-reverse' : ''}" tabindex="0" aria-label="${reversed ? '第二排' : '第一排'}回忆照片，可横向浏览"><div class="memory-stream" data-speed="${reversed ? 34 : 38}"><div class="memory-sequence">${sequence(photos)}</div><div class="memory-sequence" data-clone="true" aria-hidden="true">${sequence(photos,true)}</div></div></div>`;
      $('rail').innerHTML = `<div class="memory-scroll" id="memoryScroll">${lane(forward)}${lane(reverse,true)}</div>`;
      $('rail').querySelectorAll('.memory-stream').forEach(stream => {
        const sequenceWidth = stream.querySelector('.memory-sequence').getBoundingClientRect().width;
        const duration = Math.max(36, sequenceWidth / Number(stream.dataset.speed || 36));
        stream.style.setProperty('--rail-duration', `${duration.toFixed(2)}s`);
      });
      $('rail').querySelectorAll('[data-photo-index]').forEach(button => {
        const index = Number(button.dataset.photoIndex);
        const select = () => selectPhoto(index);
        button.addEventListener('pointerenter', select);
        button.addEventListener('focus', select);
        button.onclick = () => showPhoto(carouselPhotos[index]);
      });
      selectPhoto(activePhotoIndex);
      updatePauseControl();
    }

    function eventYear(event) { return String(event.date || '').slice(0, 4); }
    function renderYearNav() {
      const years = [...new Set(records.filter(record => record.kind === 'event').map(eventYear).filter(Boolean))].sort().reverse();
      if (activeYear !== 'all' && !years.includes(activeYear)) activeYear = 'all';
      $('yearNav').innerHTML = ['all', ...years].map(year => `<button type="button" data-year="${year}" aria-pressed="${String(year === activeYear)}">${year === 'all' ? '全部' : year}</button>`).join('');
      $('yearNav').querySelectorAll('[data-year]').forEach(button => button.onclick = () => { activeYear = button.dataset.year; renderYearNav(); renderTimeline(); });
    }

    function renderTimeline() {
      if (loadState === 'loading') {
        $('count').textContent = '00 MOMENTS';
        $('timeline').innerHTML = stateMarkup('loading', '正在读取时间线', '故事会按日期整理。');
        return;
      }
      if (loadState === 'error') {
        $('count').textContent = '00 MOMENTS';
        $('timeline').innerHTML = stateMarkup('error', '时间线暂未加载', '重新读取不会改动现有资料。', '重新读取');
        $('timeline').querySelector('[data-state-retry]').onclick = render;
        return;
      }
      const events = records.filter(record => record.kind === 'event' && (activeYear === 'all' || eventYear(record) === activeYear)).sort((a,b) => String(a.date).localeCompare(String(b.date)));
      $('count').textContent = `${String(events.length).padStart(2,'0')} MOMENTS`;
      if (!events.length) {
        $('timeline').innerHTML = `<div class="timeline-empty"><div><b>时间线还没有故事</b><p>${canWrite?'从一个日期、一句话开始。':'这里还没有公开的回忆。'}</p>${canWrite?'<button class="timeline-add" id="timelineAdd">＋ 添加事件</button>':''}</div></div>`;
        if (canWrite) $('timelineAdd').onclick = () => openEventEditor();
        return;
      }
      const rows = events.map(event => {
        const images = visibleImages(event);
        const thumbs = images.slice(0, 3).map(image => `<img src="${image.data}" alt="" loading="lazy" decoding="async">`).join('');
        const more = images.length > 3 ? `<span class="thumb-more">+${images.length - 3}</span>` : '';
        return `<button class="timeline-event" data-event="${event.id}" aria-label="查看回忆：${esc(event.title)}"><time>${formatDate(event.date)}${event.eventType === 'major' ? ' · 重要' : ''}</time><span class="event-copy"><b>${esc(event.title)}</b><p>${esc(event.story || event.place || '点击打开这段回忆')}</p></span><span class="event-thumbs">${thumbs}${more}</span></button>`;
      }).join('');
      $('timeline').innerHTML = `<div class="timeline-list">${rows}</div>${canWrite?'<button class="timeline-add" id="timelineAdd">＋ 添加事件</button>':''}`;
      $('timeline').querySelectorAll('[data-event]').forEach(button => button.onclick = () => showEvent(button.dataset.event));
      if (canWrite) $('timelineAdd').onclick = () => openEventEditor();
    }

    async function render() {
      loadState = 'loading';
      $('filmManage').disabled = true;
      $('filmManage').textContent = '正在连接…';
      $('storageNote').dataset.uiKind = 'loading';
      $('storageNote').textContent = '正在读取 CloudBase 共享回忆…';
      renderRail(); renderYearNav(); renderTimeline();
      try {
        const [loadedRecords, access] = await Promise.all([MemoryLibrary.all(), CloudBaseClient.access().catch(() => ({role:'viewer',canWrite:false}))]);
        records = loadedRecords; cloudReady = true; canWrite = Boolean(access?.canWrite); accessRole = access?.role || 'viewer'; loadState = 'ready'; renderRail();
        const linkedEvent = initialEventId && records.find(record => record.id === initialEventId && record.kind === 'event');
        const linkedPhoto = initialPhotoId && carouselPhotos.find(photo => photo.recordId === initialPhotoId || photo.image.id === initialPhotoId);
        if (linkedEvent) activeYear = eventYear(linkedEvent) || 'all';
        renderYearNav(); renderTimeline();
        if (linkedEvent) { initialEventId = ''; showEvent(linkedEvent.id); }
        else if (linkedPhoto) { initialPhotoId = ''; showPhoto(linkedPhoto); }
        $('storageNote').dataset.uiKind = canWrite ? 'ready' : 'readonly';
        $('storageNote').textContent = canWrite ? `回忆与照片已跨设备共享 · ${accessRole === 'owner' ? '主人' : '管理员'}可编辑` : '回忆与照片已跨设备共享 · 当前为只读访客';
      }
      catch (error) {
        cloudReady = false; canWrite = false; loadState = 'error';
        records = [];
        renderRail(); renderYearNav(); renderTimeline();
        $('storageNote').dataset.uiKind = 'error';
        $('storageNote').textContent = `CloudBase 连接失败：${readableError(error)} · 原有 IndexedDB 内容未改动`;
        toast(readableError(error), true);
      }
      finally {
        $('filmManage').disabled = false;
        $('filmManage').textContent = canWrite ? '管理照片' : '登录管理';
      }
    }

    function requireAccess() {
      if (!cloudReady) { toast(MemoryLibrary.status().reason || 'CloudBase 尚未连接', true); return false; }
      if (!canWrite) { location.href = 'auth.html?next=memories.html'; return false; }
      return true;
    }

    function openEventEditor(event) {
      if (!requireAccess()) return;
      $('eventEditorTitle').textContent = event ? '编辑事件' : '添加事件';
      $('eventId').value = event?.id || '';
      $('eventTitle').value = event?.title || '';
      $('eventDate').value = event?.date || MemoryLibrary.today();
      $('eventType').value = event?.eventType || 'minor';
      $('eventPlace').value = event?.place || '';
      $('eventStory').value = event?.story || '';
      $('eventImages').value = '';
      $('eventEditor').showModal();
    }

    function showEvent(id) {
      const event = records.find(record => record.id === id && record.kind === 'event');
      if (!event) return toast('这段回忆已不存在，请刷新后重试。', true);
      const images = visibleImages(event);
      activeEventId = id;
      $('detailDate').textContent = `${formatDate(event.date)}  ·  ${event.eventType === 'major' ? '大事件' : '小事件'}${event.isExample ? '  ·  示例事件' : ''}`;
      $('detailTitle').textContent = event.title;
      $('detailPlace').textContent = event.place ? `⌖ ${event.place}` : '';
      $('detailStory').textContent = event.story || '这一天还没有留下文字。';
      $('detailGallery').innerHTML = images.length ? images.map(image => `<div class="gallery-item"><img src="${image.data}" alt="${esc(image.caption || event.title)}" loading="lazy" decoding="async">${canWrite?`<button data-remove-image="${image.id}" aria-label="删除这张图片">×</button>`:''}</div>`).join('') : '<span style="grid-column:1/-1;color:#696e69;font-size:11px">这段事件还没有照片</span>';
      $('detailGallery').querySelectorAll('[data-remove-image]').forEach(button => button.onclick = () => removeEventImage(button.dataset.removeImage));
      $('detailAddImage').classList.toggle('hidden', !canWrite); $('detailEdit').classList.toggle('hidden', !canWrite); $('detailDelete').classList.toggle('hidden', !canWrite);
      if (!$('detail').open) $('detail').showModal();
    }

    function renderManagerGrid() {
      $('managerCount').textContent = `照片库共 ${carouselPhotos.length} 张`;
      if (!carouselPhotos.length) {
        $('managerGrid').innerHTML = '<p class="manager-empty">还没有照片，可以从下方批量添加。</p>';
        return;
      }
      $('managerGrid').innerHTML = carouselPhotos.map((photo, index) => `<article class="manager-card"><img src="${photo.image.data}" alt="${esc(photo.image.caption || photo.title || '回忆照片')}" loading="lazy" decoding="async"><div class="manager-card-copy"><b>${esc(photo.title || '一张照片')}</b><span>${formatDate(photo.date)} · ${photo.kind === 'event' ? '来自时间线' : '独立照片'}</span></div><button class="danger" type="button" data-manager-delete="${index}" aria-label="删除${esc(photo.title || '这张照片')}">删除</button></article>`).join('');
      $('managerGrid').querySelectorAll('[data-manager-delete]').forEach(button => button.onclick = () => deletePhoto(carouselPhotos[Number(button.dataset.managerDelete)], true));
    }
    function openPhotoManager() {
      if (!requireAccess()) return;
      $('photoForm').reset();
      $('photoDate').value = MemoryLibrary.today();
      renderManagerGrid();
      $('photoManager').showModal();
    }
    function showPhoto(photo) {
      activePhoto = photo;
      $('viewerImage').src = photo.image.data;
      $('viewerImage').alt = photo.image.caption || photo.title || '回忆照片';
      $('viewerTitle').textContent = photo.title || '一张照片';
      $('viewerMeta').textContent = formatDate(photo.date);
      $('viewerDelete').classList.toggle('hidden', !canWrite);
      if (!$('photoViewer').open) $('photoViewer').showModal();
    }

    async function deletePhoto(photo, keepManagerOpen = false) {
      if (!requireAccess()) return;
      if (!photo || !confirm(`确定删除“${photo.title || '这张照片'}”吗？删除后可在 7 秒内撤回。`)) return;
      const owner = records.find(record => record.id === photo.recordId);
      if (!owner) return toast('这张照片已不存在，请刷新后重试。', true);
      const targetIndex = carouselPhotos.findIndex(item => item.image.id === photo.image.id);
      const nextPhoto = carouselPhotos.length > 1 ? carouselPhotos[(Math.max(0, targetIndex) + 1) % carouselPhotos.length] : null;
      try {
        if (owner.kind === 'photo') await MemoryLibrary.remove(owner.id);
        else await MemoryLibrary.removePhoto(photo.image.id);
        if ($('photoViewer').open) $('photoViewer').close();
        if ($('photoManager').open && !keepManagerOpen) $('photoManager').close();
        activePhoto = null; pendingPhotoId = nextPhoto?.image.id || '';
        await render();
        if ($('photoManager').open) renderManagerGrid();
        toast('照片已删除', false, async () => { if (owner.kind === 'photo') await MemoryLibrary.restore(owner.id); else await MemoryLibrary.restorePhoto(photo.image.id); pendingPhotoId = photo.image.id; await render(); if ($('photoManager').open) renderManagerGrid(); toast('照片已恢复'); });
      } catch (error) { toast(readableError(error), true); }
    }

    async function removeEventImage(imageId) {
      if (!requireAccess()) return;
      const event = records.find(record => record.id === activeEventId);
      const imageNumber = event?.images.findIndex(image => image.id === imageId) + 1;
      if (!event || !confirm(`确定删除事件“${event.title}”中的第 ${imageNumber || '?'} 张图片吗？删除后可在 7 秒内撤回。`)) return;
      try {
        await MemoryLibrary.removePhoto(imageId); await render(); showEvent(event.id); toast('图片已删除', false, async () => { await MemoryLibrary.restorePhoto(imageId); await render(); showEvent(event.id); toast('图片已恢复'); });
      } catch (error) { toast(readableError(error), true); }
    }

    $('photoForm').onsubmit = async event => {
      event.preventDefault(); if (!requireAccess()) return; const button = $('photoSave');
      if (button.disabled) return; button.disabled = true; button.textContent = '添加中…';
      try {
        const images = await MemoryLibrary.imagesFromFiles($('photoFile').files);
        const photoDate = $('photoDate').value || MemoryLibrary.today();
        const photoTitle = $('photoTitle').value.trim() || '一张照片';
        for (const image of images) await MemoryLibrary.put({id:crypto.randomUUID(),kind:'photo',title:photoTitle,date:photoDate,story:'',place:'',images:[image]});
        pendingPhotoId = images.at(-1)?.id || '';
        $('photoManager').close(); $('photoForm').reset(); await render(); toast(`${images.length} 张图片已添加`);
      } catch (error) { toast(readableError(error), true); }
      finally { button.disabled = false; button.textContent = '添加所选图片'; }
    };

    $('eventForm').onsubmit = async event => {
      event.preventDefault(); if (!requireAccess()) return; const button = $('eventSave');
      if (button.disabled) return; button.disabled = true; button.textContent = '保存中…';
      try {
        const old = records.find(record => record.id === $('eventId').value);
        const added = await MemoryLibrary.imagesFromFiles($('eventImages').files);
        if (added.length) pendingPhotoId = added.at(-1).id;
        await MemoryLibrary.put({id:old?.id || crypto.randomUUID(),kind:'event',title:$('eventTitle').value.trim(),date:$('eventDate').value,eventType:$('eventType').value,story:$('eventStory').value.trim(),place:$('eventPlace').value.trim(),images:[...(old?.images || []),...added],isExample:false});
        $('eventEditor').close(); await render(); toast(old ? '事件已更新' : '事件已加入时间线');
      } catch (error) { toast(readableError(error), true); }
      finally { button.disabled = false; button.textContent = '保存事件'; }
    };

    $('detailAddImage').onclick = () => { if (requireAccess()) $('detailImageInput').click(); };
    $('detailImageInput').onchange = async () => {
      const event = records.find(record => record.id === activeEventId);
      if (!event || !$('detailImageInput').files.length) return;
      try {
        const added = await MemoryLibrary.imagesFromFiles($('detailImageInput').files);
        pendingPhotoId = added.at(-1)?.id || '';
        event.images = [...event.images, ...added]; await MemoryLibrary.put(event); $('detailImageInput').value = '';
        await render(); showEvent(event.id); toast(`${added.length} 张图片已加入事件`);
      } catch (error) { toast(readableError(error), true); }
    };
    $('detailEdit').onclick = () => { const event = records.find(record => record.id === activeEventId); $('detail').close(); openEventEditor(event); };
    $('detailDelete').onclick = async () => {
      if (!requireAccess()) return;
      const targetEvent = records.find(record => record.id === activeEventId);
      if (!targetEvent || !confirm(`确定删除事件“${targetEvent.title}”（${formatDate(targetEvent.date)}）吗？其中的照片也会一起删除；可在 7 秒内撤回。`)) return;
      const deletedId = targetEvent.id;
      try { await MemoryLibrary.remove(deletedId); $('detail').close(); activeEventId = ''; await render(); toast('事件已删除', false, async () => { await MemoryLibrary.restore(deletedId); await render(); toast('事件已恢复'); }); }
      catch (error) { toast(readableError(error), true); }
    };
    $('filmManage').onclick = openPhotoManager;
    $('railToggle').onclick = () => { railPaused = !railPaused; updatePauseControl(); };
    railMotionPreference.addEventListener?.('change', updatePauseControl);
    new IntersectionObserver(([entry]) => { railInView = entry.isIntersecting; updatePauseControl(); }, { threshold: .01 }).observe($('railShell'));
    document.addEventListener('visibilitychange', updatePauseControl);
    addEventListener('resize', () => {
      clearTimeout(railResizeTimer);
      railResizeTimer = setTimeout(() => {
        const width = Math.ceil($('railShell').getBoundingClientRect().width || innerWidth || 1200);
        if (Math.abs(width - renderedRailWidth) > 1) renderRail();
      }, 100);
    });
    $('viewerDelete').onclick = () => deletePhoto(activePhoto);
    $('toastAction').onclick = async () => {
      const undo = lastUndo;
      if (!undo) return;
      lastUndo = null; clearTimeout(toastTimer); $('toast').className = 'toast';
      try { await undo(); } catch (error) { toast(readableError(error), true); }
    };
    document.querySelectorAll('[data-close]').forEach(button => button.onclick = () => $(button.dataset.close).close());
    $('back').onclick = () => { if (sessionStorage.getItem('nono-index-parent') === '1' && history.length > 1) { sessionStorage.removeItem('nono-index-parent'); sessionStorage.setItem('nono-index-reset','1'); history.back(); } else location.replace('index.html'); };
    updatePauseControl();
    render();
  </script>
  <script src="assets/music-continuation.js?v=20261109e"></script>
