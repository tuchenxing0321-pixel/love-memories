<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#9d3853"><title>我们的回忆</title>
<style>
:root{color:#34282a;background:#fffaf7;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 100% 0,#f4e2dc 0,transparent 28rem),#fffaf7}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{width:min(100%,1020px);margin:auto;padding:0 24px 72px}.topbar{height:80px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;border:0;background:none;color:#96324d;font-weight:760;letter-spacing:.02em}.brand b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff9f7;background:#a63a56;font-size:14px}.topbar p{margin:0;color:#9c8282;font-size:.83rem}.hero{position:relative;overflow:hidden;padding:clamp(38px,8vw,72px);border-radius:30px;color:#fff;background:linear-gradient(125deg,#862d47,#b94d65 62%,#e39a8e);box-shadow:0 24px 55px #92364b2d}.hero:after{content:"♡";position:absolute;right:-10px;bottom:-52px;color:#ffffff17;font:290px/1 Georgia,serif}.hero>*{position:relative;z-index:1}.eyebrow{margin:0 0 15px;color:#ffe8dfc9;font-size:.72rem;font-weight:700;letter-spacing:.19em}.hero h1{max-width:680px;margin:0;font:700 clamp(2.2rem,6vw,4.2rem)/1.12 Georgia,"Songti SC",serif;letter-spacing:-.05em}.hero>p:last-of-type{max-width:500px;margin:21px 0 0;color:#fff4f0e0;line-height:1.8}.hero-stats{display:flex;flex-wrap:wrap;gap:16px 34px;margin-top:38px}.hero-stat b{display:block;font:700 1.45rem Georgia,serif}.hero-stat span{color:#ffebe4ca;font-size:.76rem}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:25px 0;border-bottom:1px solid #eadeda}.tabs{display:flex;gap:4px;margin-right:auto}.tab,.tag,.ghost,.primary{border:1px solid transparent;border-radius:12px;min-height:39px;padding:0 13px}.tab,.tag,.ghost{color:#73575b;background:transparent}.tab.on,.tag.on{color:#8f2e48;background:#f6e7e4;font-weight:700}.primary{color:#fff;background:#9b3450;box-shadow:0 9px 18px #93324825;font-weight:720}.ghost{border-color:#e7d7d1;background:#fffdfb}.search{display:flex;gap:8px;align-items:center;min-width:min(100%,220px);padding:0 12px;border:1px solid #e6d7d1;border-radius:12px;background:#fff}.search span{color:#a0747d}.search input{width:100%;height:38px;border:0;outline:0;background:transparent;color:#443437}.filterbar{display:flex;flex-wrap:wrap;gap:7px;padding:17px 0 3px}.tag{min-height:31px;padding:0 10px;color:#8b7072;background:#f8f2ef;font-size:.79rem}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:31px 0 15px}.sectionhead p{margin:0 0 5px;color:#a27c83;font-size:.76rem;letter-spacing:.09em}.sectionhead h2{margin:0;color:#463638;font:700 1.8rem Georgia,"Songti SC",serif}.count{color:#9f8788;font-size:.83rem}.timeline{position:relative}.timeline:before{content:"";position:absolute;top:30px;bottom:30px;left:22px;width:1px;background:#e5d5d1}.month{position:relative;margin:29px 0 12px;padding-left:48px;color:#9b7279;font:700 .88rem Georgia,serif;letter-spacing:.08em}.month:before{content:"";position:absolute;left:16px;top:2px;width:12px;height:12px;border:4px solid #fffaf7;border-radius:50%;background:#ad4960;box-shadow:0 0 0 1px #d7bbb6}.memory{position:relative;display:grid;grid-template-columns:94px 1fr;gap:22px;margin:13px 0 13px 48px;padding:22px;border:1px solid #eddfda;border-radius:18px;background:#fffcfa;box-shadow:0 12px 28px #7b3d4908}.day{color:#a23b54;text-align:center}.day b{display:block;font:700 2rem/.9 Georgia,serif}.day span{color:#9b8587;font-size:.72rem}.memory-top{display:flex;gap:12px;justify-content:space-between;align-items:start}.memory h3{margin:0;color:#463739;font-size:1.1rem}.place{margin:5px 0 0;color:#9b777d;font-size:.8rem}.story{margin:11px 0 0;color:#674f52;line-height:1.75}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.badges span{padding:4px 8px;border-radius:999px;color:#985066;background:#f8e9e7;font-size:.72rem}.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:15px}.media img,.media video,.media a{width:100%;height:126px;border-radius:10px;object-fit:cover;background:#eee1dc}.media a{display:grid;place-items:center;padding:14px;color:#904057;background:#f8ebe8;text-align:center;text-decoration:none;font-size:.8rem}.edit{border:0;padding:5px 7px;color:#a2707a;background:transparent;font-size:.8rem}.empty{padding:66px 20px;border:1px dashed #dcbfba;border-radius:18px;color:#967a7d;text-align:center}.empty b{display:block;margin-bottom:8px;color:#6a5053;font-size:1.1rem}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gallery article{min-height:205px;overflow:hidden;border-radius:17px;background:#f2e3df}.gallery img,.gallery video{width:100%;height:160px;object-fit:cover}.gallery div{padding:10px 12px;color:#634b4e;font-size:.83rem}footer{padding:38px 0 4px;color:#b19a9a;font-size:.76rem;text-align:center}dialog{width:min(calc(100% - 32px),560px);border:0;border-radius:22px;padding:0;color:#443437;background:#fffcfa;box-shadow:0 25px 80px #34212655}dialog::backdrop{background:#38242b61;backdrop-filter:blur(3px)}.dialog-inner{padding:23px}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.dialog-head h2{margin:0;font:700 1.35rem Georgia,serif}.close{border:0;color:#7c6266;background:none;font-size:1.4rem}.form{display:grid;gap:12px}.form label{color:#775c60;font-size:.82rem}.form input,.form textarea,.form select{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #e2d2cd;border-radius:10px;outline-color:#a13b54;background:#fff;color:#3f3032}.form textarea{min-height:105px;resize:vertical}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:end;gap:8px;margin-top:10px}.sharebox{padding:20px;text-align:center}.sharebox p{color:#765c60;line-height:1.6}.sharebox input{width:100%;padding:10px;border:1px solid #e4d5d0;border-radius:9px;background:#fff;color:#765b61;font-size:.74rem}@media(max-width:620px){.shell{padding:0 15px 50px}.topbar{height:66px}.topbar p{display:none}.hero{padding:43px 27px;border-radius:22px}.toolbar{gap:8px}.tabs{width:100%}.tab{flex:1}.search{flex:1}.memory{grid-template-columns:54px 1fr;gap:10px;margin-left:34px;padding:17px}.month{padding-left:38px}.timeline:before{left:16px}.month:before{left:10px}.day b{font-size:1.55rem}.gallery{grid-template-columns:1fr 1fr;gap:8px}.gallery article{min-height:160px}.gallery img,.gallery video{height:120px}.split{grid-template-columns:1fr}}
</style></head>
<body><main class="shell"><header class="topbar"><button class="brand" id="home" type="button"><b>♥</b>我们的回忆</button><p>把平凡的日子，收进我们的小小宇宙。</p></header><section class="hero"><p class="eyebrow">OUR LITTLE UNIVERSE</p><h1>把每一个<br>心动的瞬间留下来。</h1><p>一条可以直接分享的回忆时间线。无需账号，打开链接就能一起翻看。</p><div class="hero-stats"><div class="hero-stat"><b id="days">—</b><span>一起走过的日子</span></div><div class="hero-stat"><b id="total">0</b><span>已写下的回忆</span></div></div></section><section class="toolbar"><div class="tabs"><button class="tab on" data-view="timeline">时间线</button><button class="tab" data-view="gallery">相册</button></div><label class="search"><span>⌕</span><input id="search" placeholder="寻找海、旅行、第一次…"></label><button class="ghost" id="share" type="button">分享链接</button><button class="primary" id="add" type="button">＋ 写回忆</button></section><div class="filterbar" id="filters"></div><section id="content"></section><footer>愿每一段普通的日子，都有被想起的理由。</footer></main>
<dialog id="editor"><div class="dialog-inner"><div class="dialog-head"><h2 id="editorTitle">写下一段回忆</h2><button class="close" type="button" data-close="editor">×</button></div><form class="form" id="memoryForm"><input type="hidden" id="memoryId"><label>标题<input required id="title" maxlength="80" placeholder="例如：第一次一起看海"></label><div class="split"><label>日期<input required type="date" id="date"></label><label>地点（选填）<input id="place" maxlength="80" placeholder="厦门"></label></div><label>故事<textarea id="story" maxlength="500" placeholder="这一刻发生了什么？"></textarea></label><label>标签（用逗号隔开）<input id="tags" maxlength="120" placeholder="旅行，第一次，海边"></label><label>公开图片或视频链接（选填）<input id="mediaUrl" type="url" placeholder="https://…"></label><label>媒体类型<select id="mediaKind"><option value="image">图片</option><option value="video">视频</option><option value="link">外部链接</option></select></label><div class="actions"><button class="ghost" type="button" data-close="editor">取消</button><button class="primary" type="submit">保存回忆</button></div></form></div></dialog>
<dialog id="shareDialog"><div class="sharebox"><div class="dialog-head"><h2>分享这份回忆</h2><button class="close" type="button" data-close="shareDialog">×</button></div><p>复制下面的链接发给对方。对方打开后能看到同一份文字与公开媒体链接。</p><input id="shareUrl" readonly><div class="actions"><button class="primary" id="copy" type="button">复制链接</button></div></div></dialog>
<script>
const storage='our-memories-v2',starter=[{id:'first',date:new Date().toISOString().slice(0,10),title:'故事正在开始',place:'从今天开始',story:'照片、旅行、散步、一起吃过的饭……慢慢把这里填满。',tags:['第一段'],mediaUrl:'',mediaKind:'image'}],$=id=>document.getElementById(id),safe=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function decode(){try{const raw=location.hash.startsWith('#m=')?decodeURIComponent(escape(atob(location.hash.slice(3)))):'';const list=raw&&JSON.parse(raw);return Array.isArray(list)?list:null}catch{return null}}let shared=decode(),memories=shared||JSON.parse(localStorage.getItem(storage)||'null')||starter,view='timeline',filter='';
const save=()=>{if(!shared)localStorage.setItem(storage,JSON.stringify(memories))},encode=()=>btoa(unescape(encodeURIComponent(JSON.stringify(memories)))),format=d=>new Date(d+'T12:00:00').toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}),grouped=list=>list.slice().sort((a,b)=>b.date.localeCompare(a.date)).reduce((all,item)=>{const month=item.date.slice(0,7);(all[month]??=[]).push(item);return all},{});
function media(m){if(!m.mediaUrl)return'';const url=safe(m.mediaUrl);if(m.mediaKind==='video')return `<video controls preload="metadata" src="${url}"></video>`;if(m.mediaKind==='link')return `<a target="_blank" rel="noreferrer" href="${url}">打开外部视频或相册 ↗</a>`;return `<img loading="lazy" src="${url}" alt="${safe(m.title)}">`}
function timeline(list){if(!list.length)return '<div class="empty"><b>还没有找到这段回忆</b>换一个词试试，或写下新的故事。</div>';return `<div class="sectionhead"><div><p>MEMORIES IN TIME</p><h2>回忆时间线</h2></div><span class="count">${list.length} 段回忆</span></div><div class="timeline">${Object.entries(grouped(list)).map(([month,items])=>`<div class="month">${month.replace('-',' 年 ')} 月</div>${items.map(m=>`<article class="memory"><div class="day"><b>${m.date.slice(8)}</b><span>${m.date.slice(5,7)} 月</span></div><div><div class="memory-top"><div><h3>${safe(m.title)}</h3>${m.place?`<p class="place">⌖ ${safe(m.place)} · ${format(m.date)}</p>`:`<p class="place">${format(m.date)}</p>`}</div>${!shared?`<button class="edit" data-edit="${m.id}">编辑</button>`:''}</div>${m.story?`<p class="story">${safe(m.story)}</p>`:''}<div class="badges">${(m.tags||[]).map(tag=>`<span>#${safe(tag)}</span>`).join('')}</div>${m.mediaUrl?`<div class="media">${media(m)}</div>`:''}</div></article>`).join('')}`).join('')}</div>`}
function gallery(list){const has=list.filter(m=>m.mediaUrl);return `<div class="sectionhead"><div><p>SMALL THINGS, BIG LOVE</p><h2>回忆相册</h2></div><span class="count">${has.length} 个媒体链接</span></div>${has.length?`<div class="gallery">${has.map(m=>`<article>${media(m)}<div>${safe(m.title)}</div></article>`).join('')}</div>`:'<div class="empty"><b>相册还没有照片</b>写回忆时加上公开图片或视频链接，它会出现在这里。</div>'}`}
function render(){const query=$('search').value.trim().toLowerCase(),tags=[...new Set(memories.flatMap(m=>m.tags||[]))];$('filters').innerHTML=tags.length?`<button class="tag ${!filter?'on':''}" data-filter="">全部</button>${tags.map(tag=>`<button class="tag ${filter===tag?'on':''}" data-filter="${safe(tag)}">#${safe(tag)}</button>`).join('')}`:'';const result=memories.filter(m=>!filter||(m.tags||[]).includes(filter)).filter(m=>`${m.title} ${m.place} ${m.story} ${(m.tags||[]).join(' ')}`.toLowerCase().includes(query));$('total').textContent=memories.length;$('days').textContent=memories.length?Math.max(1,Math.floor((Date.now()-new Date(memories.map(m=>m.date).sort()[0]+'T12:00:00'))/86400000)+1):'—';$('content').innerHTML=view==='gallery'?gallery(result):timeline(result);document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>openEditor(memories.find(m=>m.id===el.dataset.edit))));document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{filter=el.dataset.filter;render()}))}
function openEditor(m){if(shared)return;$('editorTitle').textContent=m?'编辑这段回忆':'写下一段回忆';$('memoryId').value=m?.id||'';$('title').value=m?.title||'';$('date').value=m?.date||new Date().toISOString().slice(0,10);$('place').value=m?.place||'';$('story').value=m?.story||'';$('tags').value=(m?.tags||[]).join('，');$('mediaUrl').value=m?.mediaUrl||'';$('mediaKind').value=m?.mediaKind||'image';$('editor').showModal()}
$('memoryForm').addEventListener('submit',e=>{e.preventDefault();const value={id:$('memoryId').value||crypto.randomUUID(),title:$('title').value.trim(),date:$('date').value,place:$('place').value.trim(),story:$('story').value.trim(),tags:$('tags').value.split(/[,，]/).map(v=>v.trim()).filter(Boolean).slice(0,8),mediaUrl:$('mediaUrl').value.trim(),mediaKind:$('mediaKind').value},index=memories.findIndex(m=>m.id===value.id);if(index>=0)memories[index]=value;else memories.push(value);save();$('editor').close();render()});$('add').addEventListener('click',()=>openEditor());$('home').addEventListener('click',()=>{filter='';$('search').value='';view='timeline';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===view));render()});$('search').addEventListener('input',render);document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b===button));render()}));document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>$(button.dataset.close).close()));$('share').addEventListener('click',()=>{$('shareUrl').value=`${location.origin}${location.pathname}#m=${encode()}`;$('shareDialog').showModal()});$('copy').addEventListener('click',async()=>{await navigator.clipboard.writeText($('shareUrl').value);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制链接',1500)});render();
</script></body></html>
