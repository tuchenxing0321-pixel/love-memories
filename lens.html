<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <title>你的镜头 · nono &amp; txx</title>
  <link rel="icon" type="image/png" href="assets/site-logo-128.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/site-logo-180.png">
  <link rel="stylesheet" href="assets/page-transitions.css?v=20261123b">
  <style>
    :root{--paper:#f8f7f4;--surface:#fff;--ink:#24211f;--muted:#756e68;--line:#ded9d2;--accent:#7e2f40;--wash:#f3e9eb;--ease:cubic-bezier(.2,.8,.2,1)}
    *{box-sizing:border-box}html{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}body{margin:0;background:var(--paper)}button,input,textarea{font:inherit}button{color:inherit}.topbar{position:sticky;z-index:20;top:0;display:grid;height:76px;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(20px,4vw,56px);border-bottom:1px solid var(--line);background:rgba(248,247,244,.94);backdrop-filter:blur(14px)}.back,.session-button{width:max-content;padding:9px 0;border:0;background:none;color:var(--muted);cursor:pointer}.brand{font-family:Georgia,"Songti SC",serif}.session-button{justify-self:end}.hero{display:grid;min-height:430px;place-items:center;padding:76px 24px 56px;text-align:center}.kicker{margin:0 0 23px;color:var(--accent);font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em}.hero h1{margin:0;font:400 clamp(4.2rem,10vw,8.8rem)/.86 Georgia,"Songti SC",serif;letter-spacing:-.075em}.hero-copy{max-width:520px;margin:32px auto 0;color:var(--muted);font:14px/1.9 Georgia,"Songti SC",serif}.preview-badge{display:inline-flex;margin-top:22px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.55);font-size:10px;letter-spacing:.08em}.workspace{max-width:1360px;margin:0 auto;padding:0 clamp(18px,4vw,58px) 90px}.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:28px 0;border-top:1px solid var(--line)}.toolbar h2{margin:0;font:400 clamp(2rem,4vw,3.5rem)/1 Georgia,"Songti SC",serif}.toolbar p{margin:10px 0 0;color:var(--muted);font-size:12px}.add-button{padding:13px 19px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(12px,2vw,26px)}.photo{position:relative;grid-column:span 4;margin:0 0 22px;animation:arrive .45s var(--ease) both}.photo:nth-child(5n+1),.photo:nth-child(5n+4){grid-column:span 5}.photo:nth-child(5n+2),.photo:nth-child(5n+3){grid-column:span 3}.photo-frame{position:relative;overflow:hidden;aspect-ratio:4/5;border-radius:10px;background:#ebe8e3}.photo:nth-child(3n+2) .photo-frame{aspect-ratio:1}.photo-view{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}.photo img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}.photo:hover img{transform:scale(1.018)}.photo figcaption{min-height:50px;padding:12px 2px;color:var(--muted);font-size:12px;line-height:1.6}.photo figcaption strong{display:block;color:var(--ink);font-weight:500}.owner{color:var(--accent);font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}.photo-actions{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;opacity:0;transform:translateY(5px);transition:.2s}.photo:hover .photo-actions,.photo:focus-within .photo-actions{opacity:1;transform:none}.photo-actions button{min-width:44px;min-height:44px;padding:8px 11px;border:0;border-radius:999px;background:rgba(255,255,255,.93);font-size:11px;box-shadow:0 5px 18px rgba(20,18,16,.12);cursor:pointer}.empty{grid-column:1/-1;padding:100px 24px;border-top:1px solid var(--line);color:var(--muted);text-align:center;font:14px/1.9 Georgia,"Songti SC",serif}dialog{width:min(92vw,520px);padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 28px 80px rgba(36,33,31,.15)}dialog::backdrop{background:rgba(36,33,31,.22);backdrop-filter:blur(4px)}.dialog-inner{padding:28px}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}.dialog-head h2{margin:0;font:400 30px/1.1 Georgia,"Songti SC",serif}.dialog-head p{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--paper);cursor:pointer}.form{display:grid;gap:18px}.field{display:grid;gap:8px;color:var(--muted);font-size:11px}.field input,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);outline:0}.field input:focus,.field textarea:focus{border-color:#9c7d84;box-shadow:0 0 0 3px var(--wash)}.field textarea{min-height:90px;resize:vertical}.hint{margin:-7px 0 0;color:#968f89;font-size:10px;line-height:1.6}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:5px}.dialog-actions button{padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer}.dialog-actions .primary{border-color:var(--ink);background:var(--ink);color:#fff}.dialog-actions button:disabled{opacity:.55;cursor:wait}.viewer{width:min(94vw,1100px);background:#171615;border:0}.viewer .dialog-inner{position:relative;display:grid;min-height:min(84vh,760px);padding:0;place-items:center}.viewer img{display:block;max-width:100%;max-height:84vh}.viewer .close{position:absolute;z-index:2;top:16px;right:16px;color:white;border-color:rgba(255,255,255,.26);background:rgba(20,20,20,.5)}.toast{position:fixed;z-index:80;right:24px;bottom:24px;max-width:min(380px,calc(100vw - 48px));padding:13px 17px;border-radius:9px;background:#24211f;color:#fff;font-size:12px;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}@keyframes arrive{from{opacity:0;transform:translateY(12px)}}@media(max-width:800px){.topbar{height:64px}.hero{min-height:380px;padding-top:58px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.photo,.photo:nth-child(n){grid-column:span 1}.photo-actions{opacity:1;transform:none}.workspace{padding-inline:14px}.toolbar{align-items:center}.toolbar p{display:none}}@media(max-width:520px){.hero h1{font-size:3.9rem}.toolbar h2{font-size:1.8rem}.add-button{padding:11px 14px}.photo figcaption{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
    .back,.session-button,.dialog-actions button{min-height:44px}.session-button{min-width:44px}
    .add-button{min-height:44px;flex:0 0 auto;white-space:nowrap}
    .close{width:44px;min-width:44px;height:44px;flex:0 0 44px}
    html{font-family:var(--ui-font-sans)}.topbar{height:var(--ui-header-height);padding:0 var(--ui-page-gutter);background:rgba(248,247,244,.96);backdrop-filter:none}.brand{display:flex;gap:9px;align-items:center;font:600 17px/1 var(--ui-font-display);letter-spacing:-.025em}.brand img{width:24px;height:24px;object-fit:contain}.hero{padding-top:72px}.hero h1{font-family:var(--ui-font-display);font-size:clamp(4.2rem,9vw,6rem);line-height:.9;letter-spacing:-.04em}.hero-copy{font-family:var(--ui-font-display);margin-top:30px}dialog{max-height:calc(100dvh - 24px);overflow:auto}.close,.dialog-actions button{min-width:44px;min-height:44px}
    @media(max-width:620px){.topbar{grid-template-columns:minmax(0,1fr) auto;padding:0 18px}.brand{display:none}.session-button{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
    .admin-login{display:block;margin-top:4px;color:var(--muted);font-size:11px;text-align:center;text-underline-offset:3px}.hint{color:var(--muted);font-size:11px}.grid[aria-busy="true"]{opacity:.72;pointer-events:none}.preview-badge.is-ready{color:var(--accent);border-color:#d9bdc4;background:var(--wash)}.toast.error{background:var(--ui-danger)}
    @media(max-width:360px){.topbar{grid-template-columns:minmax(0,1fr) auto}.brand{display:none}}
  </style>
</head>
<body>
  <header class="topbar"><button class="back" id="back" type="button">← 返回</button><div class="brand"><img src="assets/site-logo-128.png" alt=""><span>nono &amp; txx</span></div><button class="session-button" id="sessionButton" type="button">进入</button></header>
  <main>
    <section class="hero"><div><h1>你的镜头</h1><p class="hero-copy">你记录的我们，也是这段故事的一部分。<br>放下一张照片，或一句当时想说的话。</p><span class="preview-badge" id="cloudStatus">正在连接 CloudBase…</span></div></section>
    <section class="workspace"><div class="toolbar"><div><h2>大家记录的我们</h2><p id="sessionNote">输入昵称和密钥后查看、添加照片</p></div><button class="add-button" id="addButton" type="button">＋ 添加照片</button></div><div class="grid" id="photoGrid" aria-live="polite"></div></section>
  </main>

  <dialog id="loginDialog" aria-labelledby="loginDialogTitle"><div class="dialog-inner"><div class="dialog-head"><div><h2 id="loginDialogTitle">进入你的镜头</h2><p>昵称用来标记你添加的照片。</p></div><button class="close" type="button" data-close="loginDialog" aria-label="关闭">×</button></div><form class="form" id="loginForm"><label class="field">你的昵称<input id="nickname" maxlength="24" required autocomplete="nickname" placeholder="例如：小林"></label><label class="field">共享密钥<input id="accessKey" type="password" minlength="4" required autocomplete="current-password" placeholder="输入他们给你的密钥"></label><p class="hint">共享密钥只会发送到 CloudBase 校验，不会保存在网页中。</p><div class="dialog-actions"><button type="button" data-close="loginDialog">取消</button><button class="primary" id="loginSubmit" type="submit">进入</button></div><a class="admin-login" href="auth.html?next=lens.html">主人 / 管理员使用 CloudBase 账号登录</a></form></div></dialog>

  <dialog id="photoDialog" aria-labelledby="photoDialogTitle"><div class="dialog-inner"><div class="dialog-head"><div><h2 id="photoDialogTitle">添加照片</h2><p>可以一次选择多张，说明会同时添加到这些照片。</p></div><button class="close" type="button" data-close="photoDialog" aria-label="关闭">×</button></div><form class="form" id="photoForm"><input id="editingId" type="hidden"><label class="field" id="fileField">选择照片<input id="photoFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label class="field">留下一句话（选填）<textarea id="photoNote" maxlength="160" placeholder="你是在什么时候记录下这一刻的？"></textarea></label><p class="hint">一次最多 12 张，单张原图最大 20 MB；上传前会自动压缩并同步到 CloudBase。</p><div class="dialog-actions"><button type="button" data-close="photoDialog">取消</button><button class="primary" id="photoSubmit" type="submit">保存</button></div></form></div></dialog>

  <dialog class="viewer" id="viewer" aria-label="照片预览"><div class="dialog-inner"><button class="close" type="button" data-close="viewer" aria-label="关闭">×</button><img id="viewerImage" alt=""></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script src="assets/cloudbase-dates-config.js?v=20261026b"></script>
  <script src="assets/cloudbase-config.js?v=20261026c"></script>
  <script src="assets/cloudbase-client.js?v=20261116a"></script>
  <script src="assets/lens-library.js?v=20261116a"></script>
  <script>
    const $=id=>document.getElementById(id),esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    let session=LensLibrary.session(),records=[],toastTimer=0;
    const stateMarkup=(kind,title,copy,actionId='',actionLabel='')=>`<div class="ui-state ui-state--${kind}"><span class="ui-state__line" aria-hidden="true"></span><h3 class="ui-state__title">${esc(title)}</h3><p class="ui-state__copy">${esc(copy)}</p>${actionId?`<button class="ui-state__action" id="${actionId}" type="button">${esc(actionLabel)}</button>`:''}</div>`;
    function showToast(message,error=false){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.toggle('error',error);$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200)}
    function updateSession(){const active=Boolean(session);$('sessionButton').textContent=active?`${session.nickname} · 退出`:'进入';$('sessionNote').textContent=active?(session.canManage?`已以“${session.nickname}”管理全部照片`:`你现在以“${session.nickname}”的身份查看`):'输入昵称和密钥后查看、添加照片';$('addButton').hidden=!active}
    function render(){$('photoGrid').setAttribute('aria-busy','false');$('addButton').disabled=false;if(!session){$('photoGrid').innerHTML=stateMarkup('readonly','需要昵称和共享密钥','进入后可以查看大家留下的照片，也可以添加自己的记录。','lensEnter','输入昵称进入');$('lensEnter').onclick=()=>{$('loginDialog').showModal();$('nickname').focus()};return}if(!records.length){$('photoGrid').innerHTML=stateMarkup('empty','这里还没有照片','第一个镜头，也许就从你开始。','lensAdd','添加第一张照片');$('lensAdd').onclick=()=>openEditor();return}$('photoGrid').innerHTML=records.map((item,index)=>{const label=item.note||'投稿照片',credit=session.canManage&&item.ownerNickname?`来自 ${item.ownerNickname}`:item.mine?'我添加的':'';return `<figure class="photo" style="animation-delay:${Math.min(index,8)*35}ms"><div class="photo-frame"><button class="photo-view" type="button" aria-label="查看照片：${esc(label)}" data-view="${esc(item.id)}"><img src="${esc(item.url)}" alt="${esc(label)}" loading="${index<6?'eager':'lazy'}" decoding="async"></button>${item.canEdit?`<div class="photo-actions"><button type="button" data-edit="${esc(item.id)}" aria-label="编辑${esc(label)}">编辑</button><button type="button" data-remove="${esc(item.id)}" aria-label="删除${esc(label)}">删除</button></div>`:''}</div><figcaption>${credit?`<span class="owner">${esc(credit)}</span>`:''}${item.note?`<strong>${esc(item.note)}</strong>`:''}</figcaption></figure>`}).join('');document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{const item=records.find(photo=>photo.id===button.dataset.view);$('viewerImage').src=item.url;$('viewerImage').alt=item.note||'投稿照片';$('viewer').showModal()});document.querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>openEditor(button.dataset.edit));document.querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>removePhoto(button.dataset.remove))}
    async function load(){$('photoGrid').setAttribute('aria-busy','true');$('addButton').disabled=true;$('photoGrid').innerHTML=stateMarkup('loading','正在读取共享照片','照片准备好后会在这里出现。');try{const result=await LensLibrary.list(session);records=result.photos;session={...session,...result.access};updateSession();render()}catch(error){$('photoGrid').setAttribute('aria-busy','false');$('addButton').disabled=true;$('photoGrid').innerHTML=stateMarkup('error','暂时无法读取照片','网络或云端服务暂时不可用，请稍后重试。','lensRetry','重新读取');$('lensRetry').onclick=load;showToast(error.message||'云端照片库读取失败',true)}}
    function openEditor(id=''){if(!session){$('loginDialog').showModal();$('nickname').focus();return}const item=records.find(photo=>photo.id===id);$('photoForm').reset();$('editingId').value=id;$('photoDialogTitle').textContent=item?'修改这张照片':'添加照片';$('photoNote').value=item?.note||'';$('fileField').hidden=Boolean(item);$('photoFiles').required=!item;$('photoDialog').showModal();(item?$('photoNote'):$('photoFiles')).focus()}
    async function removePhoto(id){if(!confirm('确定删除这张照片吗？'))return;try{await LensLibrary.remove(id,session);await load();showToast('照片已删除')}catch(error){showToast(error.message||'删除失败，请重试。',true)}}
    $('loginForm').onsubmit=async event=>{event.preventDefault();const button=$('loginSubmit');button.disabled=true;button.textContent='正在验证…';try{session=await LensLibrary.login($('nickname').value,$('accessKey').value);$('accessKey').value='';$('loginDialog').close();updateSession();await load();showToast(`欢迎，${session.nickname}`)}catch(error){showToast(error.message||'验证失败，请检查昵称和密钥。',true)}finally{button.disabled=false;button.textContent='进入'}};
    $('photoForm').onsubmit=async event=>{event.preventDefault();const id=$('editingId').value,button=$('photoSubmit'),label=button.textContent;button.disabled=true;button.textContent='保存中…';try{if(id)await LensLibrary.update(id,$('photoNote').value,session);else await LensLibrary.add($('photoFiles').files,$('photoNote').value,session,(current,total)=>button.textContent=`上传 ${current}/${total}`);$('photoDialog').close();await load();showToast(id?'说明已更新':'照片已同步到你的镜头')}catch(error){showToast(error.message||'保存失败，请重试。',true)}finally{button.disabled=false;button.textContent=label}};
    $('sessionButton').onclick=async()=>{if(session){try{await LensLibrary.logout(session);session=null;records=[];updateSession();render();showToast('已退出')}catch(error){showToast(error.message)}}else{$('loginDialog').showModal();$('nickname').focus()}};$('addButton').onclick=()=>openEditor();document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).close());document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()}));$('back').onclick=()=>{if(sessionStorage.getItem('nono-index-parent')==='1'&&history.length>1){sessionStorage.removeItem('nono-index-parent');sessionStorage.setItem('nono-index-reset','1');history.back()}else location.replace('index.html')};
    async function start(){updateSession();$('addButton').disabled=true;$('photoGrid').setAttribute('aria-busy','true');$('photoGrid').innerHTML=stateMarkup('loading','正在连接共享照片库','只会读取“你的镜头”中的内容。');try{session=await LensLibrary.bootstrap();$('cloudStatus').textContent='CloudBase 共享照片库';$('cloudStatus').classList.add('is-ready');updateSession();if(session)await load();else{render();setTimeout(()=>{$('loginDialog').showModal();$('nickname').focus()},280)}}catch(error){$('photoGrid').setAttribute('aria-busy','false');$('addButton').disabled=true;$('cloudStatus').textContent='CloudBase 连接失败';$('cloudStatus').classList.remove('is-ready');$('photoGrid').innerHTML=stateMarkup('error','暂时无法连接','网络或云端服务暂时不可用，你可以稍后重试。','lensReconnect','重新连接');$('lensReconnect').onclick=start;showToast(error.message||'云端连接失败',true)}}start();
  </script>
  <script src="assets/music-continuation.js?v=20261109e"></script>
</body>
</html>
